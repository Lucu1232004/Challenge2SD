<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Fondo negro verdoso -->
  <rect width="512" height="512" rx="110" fill="#0B1210"/>
  <rect x="14" y="14" width="484" height="484" rx="100" fill="none" stroke="#00D68F" stroke-width="10" opacity="0.9"/>
  <!-- Cruz médica sutil de fondo -->
  <g opacity="0.14">
    <rect x="216" y="90" width="80" height="240" rx="20" fill="#00D68F"/>
    <rect x="136" y="170" width="240" height="80" rx="20" fill="#00D68F"/>
  </g>
  <!-- Círculo central -->
  <circle cx="256" cy="225" r="115" fill="#14201C" stroke="#00D68F" stroke-width="10"/>
  <!-- Pulso -->
  <polyline points="175,225 210,225 228,190 248,260 268,200 285,225 337,225"
    fill="none" stroke="#00D68F" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Iniciales SL -->
  <text x="256" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-weight="800" font-size="72" fill="#E6F4EF" letter-spacing="4">SL</text>
  <text x="256" y="435" text-anchor="middle" font-family="Arial, sans-serif" font-weight="600" font-size="26" fill="#00D68F" letter-spacing="6">MEDICLINIC</text>
  <text x="256" y="462" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#9AB8AD">by Samuel Patiño Lucumi</text>
</svg>
